[global]
type=global
endpoint_identifier_order=ip,username
[transport-loopback]
type=transport
protocol=udp
bind=127.0.0.1:5060
[sipp]
type=endpoint
transport=transport-loopback
context=isolated-echo
disallow=all
allow=ulaw
direct_media=no
rtp_symmetric=no
force_rport=yes
rewrite_contact=no
media_address=127.0.0.1
bind_rtp_to_media_address=yes
[sipp-identify]
type=identify
endpoint=sipp
match=127.0.0.1/32
