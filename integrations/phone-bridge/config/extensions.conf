[general]
static=yes
writeprotect=yes

[owned-phone-bridge]
; Only a short-lived admission UUID from the authenticated webhook is usable.
; No dial-out application, transfer target, shell command or caller-controlled
; TCP service address exists in this context.
exten => _.,1,Set(BRIDGE_ID=${FILTER(0-9a-fA-F\-,${EXTEN})})
 same => n,GotoIf($[${LEN(${BRIDGE_ID})} != 36]?reject)
 same => n,Set(TIMEOUT(absolute)=300)
 same => n,Answer(0,i)
 same => n,AudioSocket(${BRIDGE_ID},127.0.0.1:9019)
 same => n(reject),Hangup()

exten => h,1,NoOp()
