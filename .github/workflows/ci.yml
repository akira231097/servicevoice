name: Offline regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        suite: ['0', '1', '2', '3', node]
    name: regressions (${{ matrix.suite }})
    env:
      SERVICEVOICE_DB: .local/ci-servicevoice.sqlite3
      CI_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated dependencies and verified SQLite
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -r requirements-mcp-lock.txt
          .venv/Scripts/python.exe scripts/install_sqlite_runtime.py
          npm ci --ignore-scripts
      - name: Run every offline test across disjoint shards
        shell: pwsh
        run: .venv/Scripts/python.exe -u scripts/ci_regressions.py
  linux-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest==9.1.1
      - name: Run package and isolated telephony tests
        run: python -m pytest -q deploy/test_server.py deploy/langsmith/test_templates.py deploy/lightsail/test_package.py integrations/telephony-lab/test_verify_pcap.py
